# Plan gratis: los cambios del panel se pierden cuando Render reinicia el servidor.
# Para guardarlos siempre, cambia "free" por "starter" y agrega:
#   - en envVars:  - key: CARPETA_DATOS
#                    value: /var/data
#   - y al final:  disk: { name: datos, mountPath: /var/data, sizeGB: 1 }
services:
  - type: web
    name: biblioteca-san-cayetano
    runtime: node
    plan: free
    buildCommand: "true"
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: CLAVE
        sync: false
